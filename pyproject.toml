[project]
name = "recsys-platform"
authors = [
    {name = "Adam Pirog", email = "pirog.adam@gmail.com"},
]
description = "End-to-end platform for building, evaluating, and serving personalized recommendation and ranking models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pydantic>=2.12",
]

[project.optional-dependencies]

data = [
    "polars>=1.44.2",
]

evaluation = [
    "recsys-platform[data]",
    "prettytable>=3.18",
    "tqdm>=4.67",
]

serving = [
    "fastapi>=0.140",
    "uvicorn>=0.52",
]

taobao-data = [
    "recsys-platform[data]",
    "tzdata",
]

popularity-inference = []

popularity-training = [
    "recsys-platform[popularity-inference,evaluation]",
]

matrix-factorization-inference = []

matrix-factorization-training = [
    "recsys-platform[matrix-factorization-inference,evaluation]",
    "scipy>=1.18",
    "implicit>=0.7.3",
]

all = [
    "recsys-platform[taobao-data,serving,popularity-training,matrix-factorization-training]",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9",
    "httpx2>=2"
]

[project.urls]
homepage = "https://github.com/adampirog/recsys-platform"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recsys_platform*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "recsys_platform.version.__version__"}

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-after-imports = 2