name: CI

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[all]" \
            --group dev

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t recsys-platform:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name recsys-platform-ci \
            --publish 8000:8000 \
            recsys-platform:ci

      - name: Check health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 1 \
            --retry-all-errors \
            http://localhost:8000/health

      - name: Test inference dependencies
        run: |
          docker exec -i recsys-platform-ci python - <<'PY'
          from importlib.util import find_spec

          import numpy as np

          from recsys_platform.models.popularity import PopularityRecommender

          # Ensure training dependencies are absent.
          for name in ("polars", "scipy", "implicit"):
              assert find_spec(name) is None, f"{name} leaked into inference image"

          # Create a popularity artifact.
          PopularityRecommender(
              model_id="smoke-pop",
              item_ids=np.array([10, 20], dtype=np.uint32),
              scores=np.array([1.0, 0.5], dtype=np.float32),
          ).save("/models/smoke-pop")

          PY

          # Discover the new artifacts.
          curl -fsS -X POST \
            http://localhost:8000/admin/models/refresh

          # Test popularity inference.
          curl -fsS -X POST \
            http://localhost:8000/v1/models/smoke-pop/recommendations \
            -H "Content-Type: application/json" \
            -d '{"user_ids": [1], "k": 2}' \
            | python -c 'import json, sys; assert json.load(sys.stdin)["item_ids"] == [[10, 20]]'

      - name: Show container logs on failure
        if: failure()
        run: docker logs recsys-platform-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force recsys-platform-ci || true
