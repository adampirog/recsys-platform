name: CI

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[all]" \
            --group dev

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t recsys-platform:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name recsys-platform-ci \
            --publish 8000:8000 \
            recsys-platform:ci

      - name: Check health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 1 \
            --retry-all-errors \
            http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs recsys-platform-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force recsys-platform-ci || true
